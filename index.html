<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheda Upper / Lower</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Scheda">
<meta name="theme-color" content="#1D6F82">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1EC;--surface:#FFFFFF;--ink:#16222B;--mute:#5B6B75;--line:#D3DAD6;--acc:#1D6F82;--acc-ink:#FFFFFF;--warm:#9A6410;--done:#2F7D4F;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F171C;--surface:#17232A;--ink:#E7EEF0;--mute:#8FA2AB;--line:#263540;--acc:#4FB3C8;--acc-ink:#0F171C;--warm:#E2B04A;--done:#5CC089;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F171C;--surface:#17232A;--ink:#E7EEF0;--mute:#8FA2AB;--line:#263540;--acc:#4FB3C8;--acc-ink:#0F171C;--warm:#E2B04A;--done:#5CC089;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 "Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:96px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header{padding:18px 0 6px}
h1{font:700 30px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:0}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:14px 0 10px}
nav button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 2px;font:600 15px/1.15 "Barlow",sans-serif;cursor:pointer}
nav button small{display:block;color:var(--mute);font-weight:500;font-size:12px}
nav button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
nav button[aria-pressed="true"] small{color:inherit;opacity:.85}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .2s}
.pl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:4px}
h2{font:700 22px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font:500 13px "Barlow",sans-serif;color:var(--mute)}
.list{display:grid;gap:6px}
.chk{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.box{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--mute);margin-top:1px}
.chk[aria-pressed="true"]{opacity:.6}
.chk[aria-pressed="true"] .box{background:var(--done);border-color:var(--done)}
.chk[aria-pressed="true"] .box::after{content:"";display:block;width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:translate(5px,1px) rotate(45deg)}
.chk em{display:block;font-style:normal;color:var(--mute);font-size:14px}
.ex{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:12px}
.ex.main{border-left-color:var(--acc)}
.ex h3{margin:0;font:700 20px/1.1 "Barlow Condensed","Arial Narrow",sans-serif}
.meta{margin:3px 0 10px;color:var(--mute);font-size:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.kg{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--acc)}
.kg input{width:5.2ch;min-width:5.2ch;border:0;background:transparent;color:var(--ink);font:700 28px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;padding:0;text-align:right;outline:none}
.kg input.txt{width:9ch;font-size:18px;text-align:left}
.kg span{color:var(--mute);font-size:14px}
.kg:focus-within{border-bottom-color:var(--warm)}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:46px;height:46px;border-radius:50%;border:2px solid var(--acc);background:transparent;color:var(--ink);font:700 20px "Barlow Condensed",sans-serif;cursor:pointer}
.set[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.ap{margin:10px 0 0;font-size:14px;color:var(--warm)}
.nt{margin:6px 0 0;font-size:13px;color:var(--mute)}
.reset{margin:28px 0 0;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--mute);font:600 15px "Barlow",sans-serif;cursor:pointer}
#timer{position:fixed;left:0;right:0;bottom:0;background:var(--acc);color:var(--acc-ink);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;z-index:9}
#timer.on{display:block}
#timer .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
#tt{font:700 34px/1 "Barlow Condensed",sans-serif;flex:1;font-variant-numeric:tabular-nums}
#timer small{display:block;font:500 12px "Barlow",sans-serif;opacity:.85}
#timer button{border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:8px 12px;font:600 14px "Barlow",sans-serif;cursor:pointer}
#timer.end{background:var(--warm);color:#fff}
button:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.top{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.th{width:84px;height:84px;object-fit:cover;border-radius:8px;flex:none;background:var(--line);cursor:pointer}
.hd{flex:1;min-width:0}.hd .meta{margin:3px 0 8px}
.ib{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;padding:5px 14px;font:600 14px "Barlow",sans-serif;cursor:pointer}
.ib[aria-expanded="true"]{background:var(--acc);color:var(--acc-ink)}
.pan{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:15px;line-height:1.5}
.pan.on{display:block}.pan img{width:100%;max-width:420px;border-radius:8px;margin:0 0 8px;display:block}
.pan h4{margin:12px 0 2px;font:700 17px "Barlow Condensed","Arial Narrow",sans-serif}.pan p{margin:0}
.rb{border:0;background:var(--acc);color:var(--acc-ink);border-radius:8px;padding:6px 12px;font:600 14px "Barlow",sans-serif;cursor:pointer;margin-right:6px}
.sm{margin-top:14px}.rs{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);margin:0 0 8px}.rs input{width:5ch;border:0;border-bottom:2px solid var(--acc);background:transparent;color:var(--ink);font:700 20px "Barlow Condensed","Arial Narrow",sans-serif;text-align:center;padding:0;outline:none}.rules ul{margin:0;padding-left:20px;display:grid;gap:6px}.rules li{line-height:1.45}.rules h2{margin-top:22px}.pan p{white-space:pre-line}
.edf{display:none;margin-top:10px}.edf.on{display:grid;gap:10px}.edf label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.edf textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 15px/1.4 "Barlow",sans-serif;padding:8px}
.eb{display:flex;gap:8px;flex-wrap:wrap}
#tpw{height:5px;background:rgba(255,255,255,.35);margin:-10px -14px 8px}#tp{display:block;height:100%;background:currentColor;width:100%}
.li{display:grid;gap:4px}.sm2{justify-self:start;padding:3px 12px}.lp{display:none;margin:2px 4px 6px;font-size:15px;line-height:1.5}.lp.on{display:block}
.rbar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.rules-wrap.on{outline:2px dashed var(--acc);padding:8px;border-radius:8px}
.ed,.edf2{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.ed input,.ed textarea,.edf2 input[type=text],.edf2 input:not([type]),.edf2 input[type=number],.edf2 textarea,.ced{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 15px "Barlow",sans-serif;padding:7px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 label{font-size:13px;color:var(--mute);display:grid;gap:2px}
.ck{display:flex;gap:8px;align-items:center;font-size:15px}.ck input{width:auto}
.wp{display:grid;gap:6px;margin-top:10px}.wp label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute)}.wp b{color:var(--ink);min-width:8.5em}
.wp input{width:4.5ch;border:0;border-bottom:2px solid var(--acc);background:transparent;color:var(--ink);font:700 18px "Barlow Condensed",sans-serif;text-align:center;padding:0;outline:none}.wp .rb{margin:0 0 0 auto}
.log{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:500 15px/1.4 "Barlow",sans-serif;padding:8px;resize:vertical}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Scheda Upper / Lower</h1>
<p class="sub">Tocca un esercizio per segnarlo. Toccando una serie parte il recupero.</p>
<nav id="nav" aria-label="Sessioni"></nav>
</header>
<div class="prog"><div class="bar"><i id="pb"></i></div><div class="pl"><span id="pt"></span><span id="pd"></span></div></div>
<main id="main"></main>
<button class="reset" id="reset">Azzera le spunte di questa sessione</button>
</div>
<div id="timer" role="timer" aria-live="off"><div id="tpw"><i id="tp"></i></div><div class="in"><div id="tt">0:00</div><div><small id="tl">Recupero</small></div><button id="plus">+30 s</button><button id="stop">Chiudi</button></div></div>

re la schiena dallo schienale, lavoro eccessivo del tricipite, blocco dei gomiti in avanti, spinta diseguale con le braccia. Variante con manubri (panca piana): sdraiati sulla panca piana con i manubri portati sopra il petto, piedi stabili a terra, scapole addotte e abbassate. Si scende in modo controllato con i gomiti a 45-60° dal busto fino a sentire l'allungamento del petto, poi si spinge verso l'alto fino a estensione quasi completa, senza bloccare i gomiti. Il peso per mano sarà molto più basso di quello della macchina. Senza un assistente non andare a cedimento: fermati sempre a 1-3 ripetizioni di riserva."}, "A:1": {"r": "2-3 min", "t": 180, "i": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAFoAQ4DASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAAAAECBQMEBgcI/8QAPBAAAQMDAwMDAwIFAwQABwEAAQACEQMEIQUxQRJRYQZxgRORoSKxFCMywfAHQtEVUuHxMzQ2U2JykoL/xAAZAQEAAwEBAAAAAAAAAAAAAAAAAQIDBAX/xAAjEQEBAQEAAgICAwEBAQAAAAAAAQIRAyESMSJBBFFhMhMU/9oADAMBAAIRAxEAPwDo28zH2WRsAggLGMnhSAjHfsqjM0iRvthTBIOQdljaYiJU5JypE5zgAYUmnCxiSDG87qYjbdBIQREie0qQwMAKABGAPdSyCAcIJTjE444RPOAove2mzqqPa1vJeYA+Sq+vr2kW7i2tqVs1wMEF4JB+FFsiZm36izxO4A5KRPZYbO9tL9n1LO5p1mDcsdMH23Wac4TvSyy8o5wflB3Mz90SDsccwiSDKIIjY5KU84TJ43S3G0eEBuZ/ZBJGxR33HZKcTMoAnAASJgjmEHtsokniUASScggnynMZJ+AlA3z5RgTKAOSc4HZIx4KMwMoOATKBECZ4QfIgI8pHJ745QAiUoAMjncpg4iISOT/wgCc7QO6CDKeZylzghAZzPCCYE/hG4RklBEjMmCfCPkIMjkfCAR3CJa7e0QFOImDhQbznKyAEdkQm0d1MHmVADO/wpjeIHZSJSdoHlSBETBCgAQM791IbDAQTGx7qq9Ta3R0TTalV1T+e5pFGmCOouOAQDwJyVra/6os9Ecym9rq9Z2QxkCByZOMRtuvNNV1KtqVxXuarml1VxLRUMkNmA0DYQOypvcnqOjw+G7st+mK91a+1RzDfXdWs6YDCSBPGAYIn5WvUo1GNf1vpsDYENMAncDHK1WODCIBe0nIyJjspPq1HPD2S0nAHPz3WF69KYknJGxaX91p93Tu7a4LarAHNIfPOxA38g916j6T9Y0def/CXLG296GyGgy2oBuRyD4XkgB63AgAAEGGyBClSfVtrinWovLKjSHMqMJEEZBB7qc6uap5PDnc5+30FHAwkTtkyqX0hrZ13RWXVUNbcU3GnWA2LgNx2BGVcmBzlbyyzs stensione completa della colonna, si effettua una contrazione e si avvicinano le costole al bacino. La sensazione deve essere di avvolgimento e non di flessione del tronco. Il bacino rimarrà immobile. Bisogna fare particolare attenzione a non eseguire delle flessioni dell’anca senza partecipazione sufficiente del retto addominale, poiché la postura in ginocchio predispone a questo errore. Pertanto, il corpo resta col bacino bloccato verso il basso (non c’è variazione della distanza tra coscia e addome, né tra coscia e polpaccio).", "rs": "Espira mentre ti chiudi portando le costole verso il bacino, inspira tornando alla posizione di partenza.", "er": "Flessione del tronco senza sufficiente partecipazione degli addominali, troppa velocità, avvicinare il bacino verso l’alto anziché le costole verso il basso."}, "B:9": {"r": "2 min", "t": 120, "i": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAFoAQ4DASIAAhEBAxEB/8QAGwAAAQUBAQAAAAAAAAAAAAAAAQACBAUGAwf/xAA5EAABAwMDAwMCBAUEAgIDAAABAgMRAAQhBTFBElFhBnGBE5EUIqGxByMyQsFS0eHwFTNiciRTY//EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMEBf/EACQRAAMBAAIDAAICAwEAAAAAAAABAhEDIRIxQQRRImETMkJx/9oADAMBAAIRAxEAPwD0ckRwTQkRSgAjHNL3qAad6R8A5ozjND4oBv3oEmYp1NMk0ADJkUII3M0ZxmQeaGwMc0AwzNIgzRMiKB8UANhQ70YExQJM4gUA0AmTxQgkbxTjAETnvFN5xQAjbvQMAYp3iMU2J3zUA3McGkMnNV+s65p+kNlV7cJQT/SgZUrwAMn9qzB9T63rCujQdLUhuY+s8J+YEAfJNTTc8dPv0jaqUBIkYri4+2hJKnEJMYKlACeKySfTXqG/HVqetraByW2SRHiEwP1rqj+H+nFU3F3cvHkmBP3mmv8ARrxhe2Jv11pqLly2vUOsONqKVEgLTI7ETj4q8sdVsL9PVaXTLo7IWCR7jcVhFegLt+8dKOm2teohsOrBUU8EgDc71b2X8P7RlQXcXbq1jP8AKT0/qZNROt7OlTxZ17NfIOQZFAwD4rlZ2jdk0G2lurA5dcKj9zXYjGcVo87Bwf0pud6cRzTcUA0meaBI52pxxPemmNzQC4PahtzNH3ppGfFAHY005mjxim+RQAO9CPFH3oSKA1A2oZokgYmaBBnxVILnANDiaUgAztUO51O0t23FrfbIbEqCVAkAY2GaNpeypN+kShyZ+1AiP8VV6f6g02/X9Ni6QHP/ANa/yq3jY7/FWkyJxFRNP0HLXtAOwobAk0jGe  all’inizio della salita, espira alla fine della discesa.", "er": "Ondeggiare il corpo, alzare le mani senza i gomiti (o viceversa), percorso scorretto con peso eccessivo, sollevare il braccio di scatto."}, "C:5": {"r": "60-90 s", "t": 90, "i": [], "m": "Principali: deltoide posteriore, trapezio medio/inferiore, romboidi. Secondari: cuffia dei rotatori (infraspinato, piccolo rotondo).", "ex": "In piedi davanti al cavo alto con corda, si afferra un’estremità per mano con presa neutra. Si tira la corda verso il viso separando le mani, gomiti alti, rotazione esterna delle spalle a fine movimento. Cavo altezza testa.", "rs": "Espira tirando verso il viso, inspira tornando alla posizione di partenza.", "er": ""}, "C:6": {"r": "60-90 s", "t": 90, "i": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAFoAQ4DASIAAhEBAxEB/8QAGwAAAgMBAQEAAAAAAAAAAAAAAAECBQYEAwf/xAA+EAEAAQMDAgUCBAUDAwMDBQABEQACAwQhMQVBBhJRYXGBkRMiobEHFCPB8DJC0RXh8SRSYhZDoiUzcoKy/8QAFgEBAQEAAAAAAAAAAAAAAAAAAAEC/8QAGREBAQEBAQEAAAAAAAAAAAAAAAERQSEx/9oADAMBAAIRAxEAPwDervsc0O7uhR+8Ud+KyoTbnigg9WhXj0o2EF3igJZ43o22/SiYChe099mgJfoUpXmKF2gKNpg3fSgJJ9/mi9uj8qWs9zihAJ7+1EjslA2I2ShVJiCaU++1IfTegabxRIsS+8USRuE0l3kiKCS8Rx3mlI/2oViO3aiTkIoAeN6J22ik77BUc2THhw3ZM15ZjtJuuWAKCa7zO7Rv3ZmXfvWf1HijBjYxabLkLrvLju2PNdCsDvAEzVW+J+oX5EtuwWsoWeRRexMz9Yoa2aJ3Io4+a4eldTw9TwGTEhkt/LlxrvZccj/zXaS77xQOGd05o37H1pbD/aiZGFoEsMcNHmJjf1pKcLvSgYZoJbqs7TttRJ3YpSxtxNES8LQSE3mknpLS5pNzG3YoGjtP2omGD9e1IXv9aJ3oGq/PrWY8XeLbPDmqwYcukuzmXH5y4vCN0j9K03O/BNfNv4uWFuq6bkTnFfbv/wDyn+9TB9OZCSYoF5hpbxT37J8VQDLw0RBsUSp2KN2KBMpKw0+d9qIHtRtBs0B80pj5pu4DSd159OKAmB9X96H6UEO9RCHzNzdPaCBoHwyrzFMmNiClOxty70EkqbUDgndogjmaKFNjaKBkPed6U0oJe3xThk9qDk6hrbdFhH/VlyKY8c73P9g7tZTxDbnvz6XPqdRky4VbL7LSMduR3tI7nJL3irnxIlmp6blRgyX2LGwoQL7pXnnx6fX2ZNNqBLLkJtYRERPhigzOr1Ntjp773y2Y26y66NrW42u/SPr incipali: retto addominale. Secondari: obliqui, trasverso dell’addome.", "ex": "Seduti alla macchina, si regola il sedile in modo che l’asse di rotazione sia all’altezza dell’ombelico e si appoggiano i piedi sotto i rulli o sulla pedana. Si afferrano le impugnature o si appoggia il petto al cuscino, con la schiena aderente. Si flette il busto arrotolando il tronco verso il bacino, avvicinando le costole al bacino, senza spingere con le braccia o con le gambe. Ci si ferma un istante in contrazione e si risale lentamente, mantenendo la tensione sugli addominali.", "rs": "Espira durante la flessione, inspira nel ritorno.", "er": "Spingere con le braccia o con le gambe, sedile troppo alto o troppo basso, usare slancio, carico eccessivo che porta a fare movimenti corti, perdere la tensione nel ritorno."}, "D:0": {"r": "2-3 min", "t": 180, "i": ["data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAFoAQ4DASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAAAgABAwUGBAcI/8QARhAAAQMDAgQEAwUEBggHAQAAAQIDEQAEIQUxBhJBURNhcYEikaEHFDKxwRUjQtEkJVJicvAWJjM0grLh8TU2Q0RjkqJk/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECBAMF/8QAHBEBAQACAwEBAAAAAAAAAAAAAAECESExQQME/9oADAMBAAIRAxEAPwD1cyRihjNOTAkjFNJnAxWQxBnp86UfWkT7UiYEmgEg9elARnAoyRJGaGBGe+aASYFCTOKIkE9qEkAYoGIgeVCTvRTJjrTTnp7UUB2yc0222aPb50BGaATvkbUJJnpFESYmJoc0AnJiaDYwN6kO/WozuIz5UAmSaFW8CjjMkxQxmcRQATnz86Ymc7USgJwBQkRmcVKQMzNMd6eT0oSZMk0UiYwQJod+lOYMimMgdaACTOwpEyB086RMGl6/nQc1zYWlyD94t23CepEH5jNU93wpauEm2cU0f7KxI+e9aHA60oJNax+mWPSXDG9sDe8O3tsCoN+IkZ5m8iPTeqtTa0KIUkggwcV6mR5/KuS70+0uwQ+ykq6LAhQ9x+tdGH6L1k8svlPHm05zRAzWn1DhVQldksLH9hWCPfY1nrm0etllDrakKG4Ig104fTHLp45Y3F06dqtzYKAbWVNg5bWZHt2rWafrbN01KV8ix+JC8EVgiSMHelznefLBimfzmXJj9Ljw97yZnApjNLmJOKaa+a6jmR6mmzG+aRM9ZoSe350CieuaEycUj5GmnzoGIjM0xByZGKRJ71QM628viFzTVtteGl4o5wTMBsKHlMmKKvoBEkDHWhMDOKfsBiTVC5rbyGLVwNNku3LrKgSRAQVQ const RULES=`<div class="rules"><h2>La settimana</h2><ul><li>Lunedì Upper A, martedì Lower A, mercoledì riposo, giovedì Upper B.</li><li>Venerdì Lower B solo se hai tempo e ti senti recuperato. Weekend riposo.</li><li>Cardio: 10-15 minuti a fine di ogni seduta.</li></ul><h2>Tipi di serie</h2><ul><li><b>Riscaldamento:</b> di solito una serie sui primi 3 esercizi, con più di 6 ripetizioni di riserva. Poi aspetta 30-45 secondi.</li><li><b>Preparatoria:</b> la prima serie, all’80-90% del carico. In un 3×12 fai ad esempio 8 ripetizioni, lasciandone 4 o 5 di riserva. Poi aspetta 60-90 secondi.</li><li><b>Di lavoro:</b> la seconda e la terza serie. Fai tutte le ripetizioni (ad esempio 12) lasciandone 0-1 di riserva negli isolamenti e 2-3 nei multiarticolari.</li></ul><h2>Progressione</h2><ul><li><b>Doppia progressione.</b> Tieni lo stesso peso e aggiungi ripetizioni seduta dopo seduta. Quando arrivi al massimo dell’intervallo in tutte le serie, rispettando il RIR, aumenta il carico del minimo possibile e riparti dal basso.</li><li><b>Fermo da mesi sugli stessi pesi?</b> Quando raggiungi il limite alto del range (ad esempio 12) con buona tecnica, aumenta gradualmente il carico. Riparti con meno ripetizioni e ricostruisci da lì (ad esempio 3×5-8) fino a tornare a 3×10-12 con il nuovo peso.</li><li><b>Recupero tra le serie:</b> quello indicato su ogni esercizio. Riposa abbastanza da non perdere ripetizioni nella serie dopo.</li><li><b>Recupero tra le sessioni:</b> almeno 48 ore per lo stesso gruppo muscolare.</li></ul><h2>RIR e cedimento</h2><ul><li><b>Gambe e carico libero</b> (hack squat, Smith squat, leg press, T-bar row, shoulder press Smith, hyperextension, panca inclinata con manubri): RIR 1-3, mai a cedimento. Con i manubri, senza assistente, mai a cedimento.</li><li><b>French press:</b> RIR 1-2, mai a cedimento.</li><li><b>Multiarticolari alle macchine per la parte alta:</b> RIR 1-2, l’ultima serie può arrivare a cedimento. Chest press con manubri: RIR 1-3, mai a cedimento.</li><li><b>Isolamento:</b> RIR 0-2, ultima serie a cedimento.</li><li><b>Lower B:</b> sempre RIR 2-3, mai a cedimento.</li><li><b>Prime 1-2 settimane di rientro:</b> niente cedimento su nessun esercizio, resta a RIR 2-3.</li></ul><h2>Deload</h2><ul><li>Non a data fissa: quando noti almeno 2 di questi segnali: poca voglia di andare in palestra, sonno peggiore, prestazioni in calo, più indolenzimento del solito.</li><li>Fai una settimana più leggera: riduci il peso del 30-40% con le stesse ripetizioni, oppure tieni lo stesso peso e taglia le serie (da 4 a 2-3).</li><li>Se sei già scarico, puoi saltare gli ultimi 1-2 esercizi di isolamento di ogni giornata.</li></ul><h2>Tecnica</h2><ul><li><b>Isolamento</b> (curl, pushdown, pec deck, leg extension, kickback): concentrati attivamente sul muscolo, non solo sul peso da spostare. Nel punto di massima contrazione fai una pausa di 1 secondo e stringi, poi torna giù.</li><li><b>Composti pesanti</b> (hack squat, T-bar row, chest press a carichi alti): concentrati sulla tecnica e sul movimento globale, non sulla sensazione muscolare.</li><li><b>Respirazione:</b> espira durante lo sforzo, inspira nel ritorno. Non trattenere il respiro per tutta la serie, soprattutto a 12-15 ripetizioni: può far salire la pressione e dare capogiro. Sui composti pesanti è normale una breve apnea nel punto più duro, per una frazione di secondo.</li></ul><h2>Cue mentali per muscolo</h2><p><b>Upper</b></p><ul><li><b>Dorsali:</b> porta i gomiti in tasca.</li><li><b>Petto:</b> porta i bicipiti vicino al petto, “chiudi le braccia”.</li><li><b>Spalle laterali:</b> allontana i gomiti dal busto.</li><li><b>Spalle sopra la testa:</b> spingi verso il soffitto.</li><li><b>Deltoidi posteriori:</b> gomiti indietro e verso l’esterno, senza usare i trapezi.</li><li><b>Trapezi:</b> spalle verso le orecchie, senza ruotarle.</li><li><b>Bicipiti:</b> porta il polso verso le spalle, senza oscillare col busto.</li><li><b>Tricipiti:</b> spingi il gomito fino a bloccarlo, gomiti fermi.</li></ul><p style="margin-top:12px"><b>Lower</b></p><ul><li><b>Quadricipiti:</b> spingi il pavimento via da te (pressa, squat). Nella leg extension estendi le ginocchia e fai una pausa in alto.</li><li><b>Femorali:</b> tallone verso il gluteo (leg curl). Negli stacchi rumeni, fianchi indietro con la schiena neutra.</li><li><b>Glutei:</b> fianchi in avanti e stringi in alto (hip thrust). Spingi con il tallone (pressa, affondi).</li><li><b>Polpacci:</b> sali sulla punta dell’alluce, pausa in alto, scendi lentamente fino allo stiramento.</li></ul><p style="margin-top:12px"><b>Addome (in qualsiasi giorno)</b></p><ul><li>Avvicina le costole al bacino, senza tirare con il collo.</li><li>Nel plank, tira l’ombelico verso la colonna.</li></ul></div>`;

const INF={U:{w:["Braccia lungo i fianchi, fai cerchi ampi con le spalle in avanti e poi indietro, lenti e controllati.","Mani sulle spalle, disegna cerchi con i gomiti, in avanti e poi indietro.","Braccia lungo i fianchi, porta le scapole in alto, indietro, in basso e avanti, senza muovere il busto.","In piedi, gambe larghe quanto le spalle, ruota il busto a destra e a sinistra con le braccia morbide e il bacino fermo.","Schiena e avambracci contro il muro: fai scivolare le braccia in alto e in basso mantenendo il contatto.","In plank o contro il muro, dopo ogni flessione spingi forte e allontana il petto dal pavimento (protrazione scapolare)."],
s:["Avambraccio al muro con il gomito a 90°, ruota il busto in direzione opposta finché senti allungare il petto.","Aggrappato a una sbarra o a un supporto, lascia scendere il bacino indietro e allunga il fianco.","Porta un braccio disteso davanti al petto e tienilo con l’altro, senza alzare la spalla.","Mano dietro la schiena tra le scapole, con l’altra spingi delicatamente il gomito verso il basso.","Braccio disteso dietro, palmo verso l’alto su un appoggio, ruota il busto in direzione opposta.","In ginocchio, siedi sui talloni e porta le braccia avanti con la fronte a terra, respirando lento."]},
L:{w:["Seduto con le gambe aperte, porta il busto verso un piede e poi verso l’altro, senza forzare.","In affondo, spingi il bacino avanti e indietro con piccole oscillazioni per aprire l’anca.","In quadrupedia, alterna schiena inarcata e arrotondata seguendo il respiro.","In quadrupedia, una mano dietro la testa: ruota il busto aprendo il gomito verso il soffitto.","In affondo con una mano a terra, ruota il busto verso la gamba avanti sollevando il braccio.","Seduto o in piedi, disegna cerchi con la punta del piede nei due sensi.","Appoggiato a un supporto, fai oscillare la gamba avanti e indietro con ampiezza progressiva.","In piedi su una gamba, solleva il ginocchio e disegna cerchi ampi con l’anca.","Piedi larghi quanto le spalle, scendi controllato con la schiena dritta e le ginocchia in linea con i piedi."],
s:["In piedi, porta il tallone al gluteo e tieni la caviglia, ginocchia vicine e bacino in avanti.","Gamba tesa avanti con il tallone a terra, inclinati in avanti con la schiena dritta.","Da sdraiato, caviglia su un ginocchio e tira la coscia verso il petto.","Mani al muro, tallone della gamba dietro a terra, spingi il bacino in avanti.","Gambe larghe, sposta il peso su un lato mantenendo la gamba opposta tesa.","Da seduto, piante dei piedi unite e ginocchia verso terra, schiena dritta.","A pancia in giù, appoggiati sugli avambracci e solleva il busto con il bacino a terra."]}};

const t=ev.target.closest("[data-t]");if(t){st.cur=t.dataset.t;save();render();window.scrollTo(0,0);return}
const b=ev.target.closest("[data-k]");if(b){const k=b.dataset.k,on=!st.chk[k];st.chk[k]=on;if(!on)delete st.chk[k];b.setAttribute("aria-pressed",on);save();prog();if(on&&b.dataset.rest)startTimer(+b.dataset.rest,b.dataset.n)}});
document.addEventListener("input",ev=>{const i=ev.target.closest("[data-kg]");if(!i)return;st.kg[i.dataset.kg]=i.value;save();const a=$("ap-"+i.dataset.kg);if(a)a.textContent=apLine(i.value)});
$("reset").onclick=()=>{const p=st.cur+":";for(const k in st.chk)if(k.startsWith(p))delete st.chk[k];save();render()};
let end=0,tm=null,tot=1;
function startTimer(sec,n){tot=sec*1000;end=Date.now()+tot;$("timer").className="on";$("tl").textContent=n?"Recupero · "+n:"Recupero";if(!tm)tm=setInterval(tick,250);tick()}
function tick(){const r=Math.ceil((end-Date.now())/1000);if(r<=0){$("tt").textContent="Via!";$("tl").textContent="Recupero finito";$("timer").className="on end";if(tm){clearInterval(tm);tm=null;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}return}
$("tt").textContent=Math.floor(r/60)+":"+String(r%60).padStart(2,"0");$("tp").style.width=Math.max(0,(end-Date.now())/tot*100)+"%"}
$("plus").onclick=()=>{if(!tm){end=Date.now();$("timer").className="on";tm=setInterval(tick,250)}end+=30000;tot+=30000;$("timer").className="on";tick()};
$("stop").onclick=()=>{$("timer").className="";if(tm){clearInterval(tm);tm=null}};
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
